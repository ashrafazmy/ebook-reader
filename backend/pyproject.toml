[project]
name = "ebook-reader-backend"
version = "0.1.0"
description = "Local EPUB reader API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "defusedxml>=0.7.1",
    "ebooklib>=0.20",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
